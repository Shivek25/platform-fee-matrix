<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="pfm-dark-bg" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <filter id="pfm-dark-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular background badge with Emerald-to-Amber gradient & soft shadow -->
  <circle cx="256" cy="256" r="236" fill="url(#pfm-dark-bg)" filter="url(#pfm-dark-shadow)" />

  <!-- Centered Calculator (Brand Lucide Geometry) -->
  <g transform="translate(40, 40) scale(18)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Solid high-contrast white calculator housing with Midnight border -->
    <rect x="4" y="2" width="16" height="20" rx="2.5" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.8" />
    <!-- Display screen line -->
    <line x1="7.5" y1="6.5" x2="16.5" y2="6.5" stroke="#0B0F17" stroke-width="2.2" />
    <!-- Action / Plus vertical key in Amber Gold -->
    <line x1="16" y1="14" x2="16" y2="18" stroke="#F59E0B" stroke-width="2.2" />
    <!-- Keypad dot matrix in Midnight Ink -->
    <path d="M16 10.2h.01" stroke="#0B0F17" stroke-width="2.6" />
    <path d="M12 10.2h.01" stroke="#0B0F17" stroke-width="2.6" />
    <path d="M8 10.2h.01" stroke="#0B0F17" stroke-width="2.6" />
    <path d="M12 14.2h.01" stroke="#0B0F17" stroke-width="2.6" />
    <path d="M8 14.2h.01" stroke="#0B0F17" stroke-width="2.6" />
    <!-- Profit green action keys -->
    <path d="M12 18.2h.01" stroke="#10B981" stroke-width="2.6" />
    <path d="M8 18.2h.01" stroke="#10B981" stroke-width="2.6" />
  </g>
</svg>
